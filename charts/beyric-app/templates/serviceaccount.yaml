{{- range $name, $c := .Values.components }}
{{- if eq (include "beyric-app.enabled" $c) "true" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $c.serviceAccount | default $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "beyric-app.labels" (dict "root" $ "name" $name) | nindent 4 }}
  annotations: { argocd.argoproj.io/sync-wave: "0" }
automountServiceAccountToken: {{ if $c.vaultAgent }}true{{ else }}false{{ end }}
{{- end }}
{{- end }}
{{- if .Values.migration.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.migration.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "beyric-app.labels" (dict "root" . "name" "db-migrate") | nindent 4 }}
  # PreSync hooks run before every ordinary resource, so the Job's ServiceAccount
  # must itself be a PreSync hook at an earlier wave or the pod is refused with
  # "error looking up service account". No delete policy: it persists between syncs.
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
{{- end }}
