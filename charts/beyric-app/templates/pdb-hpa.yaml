{{- range $name, $c := .Values.components }}
{{- if eq (include "beyric-app.enabled" $c) "true" }}
{{- $pdb := $c.pdb | default dict }}
{{- if $pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "beyric-app.labels" (dict "root" $ "name" $name) | nindent 4 }}
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  minAvailable: {{ $pdb.minAvailable | default 1 }}
  selector:
    matchLabels: {{- include "beyric-app.selector" (dict "root" $ "name" $name) | nindent 6 }}
{{- end }}
{{- $hpa := $c.hpa | default dict }}
{{- if $hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "beyric-app.labels" (dict "root" $ "name" $name) | nindent 4 }}
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ $hpa.minReplicas | default 2 }}
  maxReplicas: {{ $hpa.maxReplicas | default 4 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $hpa.cpu | default 70 }} }
{{- end }}
{{- end }}
{{- end }}
