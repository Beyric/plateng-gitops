{{- if .Values.externalSecret.enabled }}
{{- $e := .Values.externalSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $e.name | required "externalSecret.name is required" }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "beyric-app.labels" (dict "root" . "name" $e.name) | nindent 4 }}
  # PreSync hook, like the migration ServiceAccount: the migration Job consumes
  # this Secret via envFrom and hooks run before ordinary resources. Argo waits
  # for the ExternalSecret to be Healthy (Ready) before the next hook wave.
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ $e.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $e.clusterSecretStore }} }
  target: { name: {{ $e.name }}, creationPolicy: Owner }
  {{- if $e.keys }}
  # Explicit key list (stage): only these keys reach the pod, whatever else is written at the Vault path.
  # A key missing in Vault makes the ExternalSecret report SecretSyncedError, loudly, instead of vanishing.
  data:
    {{- range $e.keys }}
    - { secretKey: {{ . }}, remoteRef: { key: {{ $e.vaultPath | required "externalSecret.vaultPath is required" }}, property: {{ . }} } }
    {{- end }}
  {{- else }}
  dataFrom:
    - extract: { key: {{ $e.vaultPath | required "externalSecret.vaultPath is required" }} }
  {{- end }}
{{- end }}
