{{- if .Values.externalSecret.enabled }}
{{- $e := .Values.externalSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $e.name | required "externalSecret.name is required" }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "beyric-app.labels" (dict "root" . "name" $e.name) | nindent 4 }}
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  refreshInterval: {{ $e.refreshInterval }}
  secretStoreRef: { kind: ClusterSecretStore, name: {{ $e.clusterSecretStore }} }
  target: { name: {{ $e.name }}, creationPolicy: Owner }
  dataFrom:
    - extract: { key: {{ $e.vaultPath | required "externalSecret.vaultPath is required" }} }
{{- end }}
