#    probes: { path: /, startupFailureThreshold: 30 }
#    resources: {}
#    hpa: { enabled: false, minReplicas: 2, maxReplicas: 4, cpu: 70 }
#    pdb: { enabled: false, minAvailable: 1 }
#    terminationGracePeriodSeconds: 30
#    preStopSleep: 5
#    vaultAgent: false
#    writableDirs: [/tmp]     # emptyDirs because the root filesystem is read-only

# Argo CD PreSync Job running schema migrations with a Vault init container only
# (agent-pre-populate-only), so the Job can complete.
migration:
  enabled: false
  serviceAccount: db-migrate
  vaultRole: ""
  dbCredsPath: ""
  command: []
  activeDeadlineSeconds: 600
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# App secrets from Vault KV via External Secrets Operator (ADR-019 dataFrom.extract).
externalSecret:
  enabled: false
  name: ""
  vaultPath: ""            # e.g. weysure/prod (under the `secret/` mount)
  refreshInterval: 1h
  clusterSecretStore: vault
