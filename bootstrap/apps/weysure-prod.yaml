apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weysure-prod
  namespace: argocd
  # Wave 6: after Vault (3), ingress (4) and platform secrets (5). The bootstrap
  # Job inside talks to Vault directly, so Vault must be up and unsealed first.
  annotations: { argocd.argoproj.io/sync-wave: "6" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/Beyric/plateng-gitops
    targetRevision: main
    path: projects/weysure/environments/prod
    directory: { recurse: true }
  destination: { server: https://kubernetes.default.svc, namespace: weysure-prod }
  syncPolicy:
    automated: { prune: true, selfHeal: false }
    syncOptions: [CreateNamespace=true]
