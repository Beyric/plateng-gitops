apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
  # Wave 5, not 3. These ExternalSecrets write into the cert-manager and
  # external-dns namespaces, which their own charts create in wave 4. An
  # ExternalSecret applied before its target namespace exists fails the sync.
  annotations: { argocd.argoproj.io/sync-wave: "5" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/Beyric/plateng-gitops
    targetRevision: main
    path: platform/secrets
  destination: { server: https://kubernetes.default.svc }
  syncPolicy:
    automated: { prune: true, selfHeal: false }
