# Phase 9: Alloy DaemonSet ships every pod's stdout AND stderr to Loki. It reads
# through the kubelet's log API (loki.source.kubernetes), so it needs no hostPath
# mount, no privilege, and works on the read-only baseline. Labels: namespace,
# pod, container, node, app (app.kubernetes.io/name).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "7" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.12.1
    helm:
      valuesObject:
        fullnameOverride: alloy
        controller:
          type: daemonset
          volumes:
            extra:
              - { name: alloy-storage, emptyDir: {} }
          tolerations:
            - { operator: Exists }        # every node, including any tainted one
        alloy:
          # Alloy keeps its WAL/positions under storagePath; the rootfs is read-only,
          # so that path is an emptyDir (Phase 7 lesson: every writable path explicit).
          storagePath: /tmp/alloy
          mounts:
            extra:
              - { name: alloy-storage, mountPath: /tmp/alloy }
          securityContext:
            runAsNonRoot: true
            runAsUser: 473
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 30m, memory: 96Mi }
            limits: { memory: 192Mi }
          configMap:
            content: |
              logging { level = "warn" }

              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("HOSTNAME_NODE")
                }
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                rule { source_labels = ["__meta_kubernetes_namespace"];      target_label = "namespace" }
                rule { source_labels = ["__meta_kubernetes_pod_name"];       target_label = "pod" }
                rule { source_labels = ["__meta_kubernetes_pod_container_name"]; target_label = "container" }
                rule { source_labels = ["__meta_kubernetes_pod_node_name"];  target_label = "node" }
                rule { source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]; target_label = "app" }
                rule { source_labels = ["__meta_kubernetes_pod_phase"]; regex = "Pending|Succeeded|Failed|Unknown"; action = "drop" }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint { url = "http://loki.monitoring.svc:3100/loki/api/v1/push" }
                external_labels = { cluster = "beyric-prod" }
              }
          extraEnv:
            - name: HOSTNAME_NODE
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: false }
    retry: { limit: 5, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
