# Phase 9: Alloy DaemonSet ships every pod's stdout AND stderr to Loki. It reads
# through the kubelet's log API (loki.source.kubernetes), so it needs no hostPath
# mount, no privilege, and works on the read-only baseline. Labels: namespace,
# pod, container, node, app (app.kubernetes.io/name).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "7" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.12.1
    helm:
      valuesObject:
        fullnameOverride: alloy
        controller:
          type: daemonset
          # Node agent: must run on every node, even a full one (2026-10-08 wake:
          # Pending on a 99 %-requested system node, no logs from it).
          priorityClassName: system-node-critical
          volumes:
            extra:
              - { name: alloy-storage, emptyDir: {} }
          tolerations:
            - { operator: Exists }        # every node, including any tainted one
        alloy:
          # Alloy keeps its WAL/positions under storagePath; the rootfs is read-only,
          # so that path is an emptyDir (Phase 7 lesson: every writable path explicit).
          storagePath: /tmp/alloy
          mounts:
            extra:
              - { name: alloy-storage, mountPath: /tmp/alloy }
          securityContext:
            runAsNonRoot: true
            runAsUser: 473
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 30m, memory: 96Mi }
            limits: { memory: 192Mi }
          configMap:
            content: |
              logging { level = "warn" }

              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("HOSTNAME_NODE")
                }
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_phase"]
                  regex         = "Pending|Succeeded|Failed|Unknown"
                  action        = "drop"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.process.redact.receiver]
              }

              // Never store login tokens: any JWT anywhere in a line becomes <redacted-jwt>
              // before it reaches Loki. Found 2026-10-15: the API access log wrote the
              // WebSocket ?token=<JWT> (Weysure-API#76), 7-day tokens = 7-day retention.
              // Applies to every namespace, so a future leak elsewhere is covered too.
              loki.process "redact" {
                forward_to = [loki.write.default.receiver]
                // Deal-invite links carry their token as a path segment: API
                // /api/v1/invites/<token>[/claim|/decline] and the web page /invite/<token>,
                // also in Referer fields. Redacted by position, not by shape, so a change
                // of token format (JWT today, Weysure-API #75) cannot reopen the leak.
                // Same output as the app's own access-log filter (app/core/log_redaction.py).
                stage.replace {
                  expression = `(?:/api/v1/invites/|/invite/)([^/?#\s"']+)`
                  replace    = "{token}"
                }
                stage.replace {
                  expression = `(eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{4,}\.[A-Za-z0-9_-]+)`
                  replace    = "<redacted-jwt>"
                }
                // Sign-in cookies (cookie mode, Weysure-API feature/auth-2fa-api): the access
                // cookie is a JWT (masked above), but the refresh, device and 2FA cookies are
                // opaque. Nothing logs them today (Traefik logs no header fields; 7 days of Loki
                // show none). These three stages are the net if a header, a Set-Cookie or a cookie
                // dict is ever logged: by cookie name, by header name, and by dict/JSON key.
                stage.replace {
                  expression = `\bwey_(?:at|aat|rt|art|did|mfa)=([^;\s"',]+)`
                  replace    = "<redacted-cookie>"
                }
                stage.replace {
                  expression = `["']wey_(?:at|aat|rt|art|did|mfa)["']\s*:\s*["']([^"']+)["']`
                  replace    = "<redacted-cookie>"
                }
                stage.replace {
                  expression = `(?i)\b(?:set-)?cookie["']?\s*[:=]\s*["']?([^"'\r\n]+)`
                  replace    = "<redacted-cookie>"
                }
              }

              loki.write "default" {
                endpoint { url = "http://loki.monitoring.svc:3100/loki/api/v1/push" }
                external_labels = { cluster = "beyric-prod" }
              }
          extraEnv:
            - name: HOSTNAME_NODE
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: false }
    retry: { limit: 5, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
