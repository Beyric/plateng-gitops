apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "4" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/Beyric/plateng-gitops
    targetRevision: main
    path: platform/kyverno
  destination: { server: https://kubernetes.default.svc, namespace: kyverno }
  syncPolicy:
    automated: { prune: true, selfHeal: false }
    retry: { limit: 5, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
