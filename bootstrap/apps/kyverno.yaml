# Kyverno (Phase 8, spec D5): admission policy engine. Policies start in Audit
# and are promoted to Enforce for weysure-prod after seven clean days of
# policy reports. Platform namespaces stay Audit (Jenkins agents need root).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Kyverno mutates its own CRDs/webhooks after install; diff server-side (platform notes).
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.1
    helm:
      valuesObject:
        admissionController:
          replicas: 2
          nodeSelector: { node-role: system }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
        backgroundController: { nodeSelector: { node-role: system } }
        cleanupController: { nodeSelector: { node-role: system } }
        reportsController: { nodeSelector: { node-role: system } }
        # Never block the platform's own namespaces on a webhook outage.
        config:
          preserve: false   # Kyverno platform notes for Argo CD
          webhooks:
            namespaceSelector:
              matchExpressions:
                - { key: kubernetes.io/metadata.name, operator: NotIn, values: [kube-system, argocd, vault, kyverno] }
  destination: { server: https://kubernetes.default.svc, namespace: kyverno }
  syncPolicy:
    automated: { prune: true, selfHeal: false }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 5, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
