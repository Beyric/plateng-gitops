# Wave 1: the controller and its CRDs.
# IAM, the node role, the instance profile and the SQS interruption queue were
# created by Terraform in Phase 1 — this is only the in-cluster half.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: 1.14.1
    helm:
      values: |
        settings:
          clusterName: beyric-prod
          interruptionQueue: Karpenter-beyric-prod
        # Authentication is an EKS Pod Identity association created by Terraform,
        # so no IRSA annotation and no static credentials are needed here.
        serviceAccount:
          create: true
          name: karpenter
        replicas: 1
        controller:
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { memory: 512Mi }
        # Karpenter must not run on nodes Karpenter manages, or it can evict itself.
        nodeSelector:
          node-role: system
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
