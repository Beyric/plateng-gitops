apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    # Wave 3: the CRDs arrive with the ESO chart in wave 1, and Vault must be
    # reachable before a store pointing at it can become Ready.
    argocd.argoproj.io/sync-wave: "3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/Beyric/plateng-gitops
    targetRevision: main
    path: platform/external-secrets
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: false }
    syncOptions: [CreateNamespace=false]
