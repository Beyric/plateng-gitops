apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube-postgres
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "7" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source: { repoURL: https://github.com/Beyric/plateng-gitops, targetRevision: main, path: platform/sonarqube }
  destination: { server: https://kubernetes.default.svc, namespace: sonarqube }
  syncPolicy: { automated: { prune: true, selfHeal: false } }
