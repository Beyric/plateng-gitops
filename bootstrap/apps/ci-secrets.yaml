apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ci-secrets
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "6" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source: { repoURL: https://github.com/Beyric/plateng-gitops, targetRevision: main, path: platform/ci-secrets }
  destination: { server: https://kubernetes.default.svc }
  syncPolicy: { automated: { prune: true, selfHeal: false } }
