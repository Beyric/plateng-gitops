apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "4" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.4.0
    helm:
      valuesObject:
        service:
          type: LoadBalancer
          annotations:
            # NLB, not the default Classic ELB: layer 4, far cheaper, and it
            # preserves the client connection for Cloudflare to terminate.
            # "external" hands this Service to the AWS Load Balancer Controller
            # (Phase 8, spec D1); the in-tree controller ignores it from then on.
            # Targets are Traefik pod IPs, registered only when the readiness gate
            # passes and deregistered before the pod stops - no node-roll blips.
            service.beta.kubernetes.io/aws-load-balancer-type: "external"
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
            service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
            service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
            # Health check straight at the pod (ip targets): Traefik's /ping lives on
            # the internal entrypoint, container port 8080, which the Service does not
            # expose - so the port is numeric, not a Service port name.
            service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: "HTTP"
            service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: "/ping"
            service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "8080"
            service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: "deregistration_delay.timeout_seconds=30"
          # Only Cloudflare may reach the origin (ADR-011). The Load Balancer
          # Controller writes these ranges into the NLB's frontend security
          # group, which otherwise admits 0.0.0.0/0 on 80/443 and lets anyone
          # skip the WAF by calling the NLB hostname directly (found 2026-10-12).
          # Every public host is Cloudflare-proxied, so no client is lost.
          # Source: https://www.cloudflare.com/ips-v4 (checked 2026-10-13).
          # Keep in step with forwardedHeaders.trustedIPs below.
          spec:
            loadBalancerSourceRanges:
              - 173.245.48.0/20
              - 103.21.244.0/22
              - 103.22.200.0/22
              - 103.31.4.0/22
              - 141.101.64.0/18
              - 108.162.192.0/18
              - 190.93.240.0/20
              - 188.114.96.0/20
              - 197.234.240.0/22
              - 198.41.128.0/17
              - 162.158.0.0/15
              - 104.16.0.0/13
              - 104.24.0.0/14
              - 172.64.0.0/13
              - 131.0.72.0/22
        # Chart 41 removed the ports.web.redirectTo, ports.websecure.tls and
        # top-level logs values. Everything below is expressed as Traefik's own
        # CLI flags instead, which have been stable for years and are not
        # subject to the chart's values schema changing under us again.
        # Phase 9: scraped by Prometheus (monitoring namespace, nil selectors pick up every ServiceMonitor).
        metrics:
          prometheus:
            service: { enabled: true }
            serviceMonitor: { enabled: true, interval: 30s }
        additionalArguments:
          # Plain HTTP is only ever a redirect - everything arrives over HTTPS
          # through Cloudflare.
          - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
          - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
          - "--entryPoints.web.http.redirections.entryPoint.permanent=true"
          - "--entryPoints.websecure.http.tls=true"
          # Cloudflare proxies every request, so without this Traefik sees
          # Cloudflare's IP as the client and rate limiting would treat the
          # whole internet as one caller (ADR-011).
          - "--entryPoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
          - "--log.level=INFO"
          - "--accesslog=true"
        providers:
          kubernetesCRD: { enabled: true, allowCrossNamespace: false }
          kubernetesIngress: { enabled: true, publishedService: { enabled: true } }
        # Ingress objects with no ingressClassName still route here.
        ingressClass: { enabled: true, isDefaultClass: true }
        resources:
          requests: { cpu: 50m, memory: 96Mi }
        # The single ingress replica was evicted by Karpenter drift during the
        # 1.32 upgrade and every host went dark for ~50 s (Finding 38). Two
        # replicas, one per system node, and a budget of one.
        deployment:
          replicas: 2
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
        nodeSelector:
          node-role: system
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
        # Only the NLB may talk to the entrypoints (2026-10-13). Without this any
        # pod in the cluster (a Jenkins agent running PR code included) could call
        # Traefik directly with its own CF-Connecting-IP, which the API trusts
        # from 10.0.0.0/16. The NLB's ENIs live in the public subnets; no pod does
        # (pods are in 10.0.3.0/24 and 10.0.4.0/24). 8080 is the NLB health check.
        # Kubelet probes are still allowed by the VPC CNI agent (default-deny in
        # weysure-prod has run with probes since Phase 8).
        extraObjects:
          - apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata: { name: traefik-ingress-from-nlb, namespace: traefik }
            spec:
              podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
              policyTypes: [Ingress]
              ingress:
                - from:
                    - ipBlock: { cidr: 10.0.1.0/24 }   # beyric-prod-vpc-public-us-east-1a
                    - ipBlock: { cidr: 10.0.2.0/24 }   # beyric-prod-vpc-public-us-east-1b
                  ports:
                    - { protocol: TCP, port: 8000 }
                    - { protocol: TCP, port: 8443 }
                    - { protocol: TCP, port: 8080 }
                - from:
                    - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
                  ports:
                    - { protocol: TCP, port: 9100 }
  destination: { server: https://kubernetes.default.svc, namespace: traefik }
  syncPolicy:
    managedNamespaceMetadata:
      labels: { elbv2.k8s.aws/pod-readiness-gate-inject: enabled }
    automated: { prune: true, selfHeal: false }
    syncOptions: [CreateNamespace=true]
