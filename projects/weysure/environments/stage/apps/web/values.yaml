# weysure-web on STAGE (namespace weysure-stage). Mirrors ../../../prod/apps/web/values.yaml with one replica.
# NEXT_PUBLIC_* values are baked at build time by Jenkins, and stage has its OWN web build
# (tag <sha12>-stage in images.yaml) whose NEXT_PUBLIC_API_URL / NEXT_PUBLIC_WS_URL point at
# api-staging.weysure.com. The prod image would call the production API from this site. The runtime
# image holds no secrets.
image:
  repository: 767397877316.dkr.ecr.us-east-1.amazonaws.com/weysure-web
imageTagKey: web

# Luran AI support chat widget (spec: the web repo's docs/sop luran SOP). LURAN_API_KEY is the widget's PUBLIC key.
# It is kept out of git: it lives at the Vault path below and reaches the pod through this ExternalSecret. A key
# missing in Vault makes the ExternalSecret report SecretSyncedError (loud) and a new web pod will not start,
# so the key must be in Vault BEFORE this merges. Unset it (or LURAN_TENANT_ID) and the widget switches off.
envFromSecrets: [weysure-web-config]

externalSecret:
  enabled: true
  name: weysure-web-config
  vaultPath: weysure/stage                       # STAGE
  keys:
    - LURAN_API_KEY

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile: { type: RuntimeDefault }

components:
  web:
    replicas: 1                      # STAGE (prod: 2, HPA 2-4); no HPA, no PDB, no hard node spread (see api values)
    port: 3000
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      LURAN_TENANT_ID: "a2484db6-8cf0-4def-87c2-4953de152f73"   # public tenant id of the Luran widget
    ingress:
      enabled: true
      host: staging.weysure.com
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: weysure-stage-noindex@kubernetescrd
    probes: { path: / }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    writableDirs: [/tmp, /app/.next/cache]
