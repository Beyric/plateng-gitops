# One-shot bootstrap of the STAGE database (plain Job: no Argo hook and no TTL, so it is applied
# once and stays Complete as the record; ADR-022, and the reason db-bootstrap was retired in prod,
# gitops #21: a hook re-runs on every sync and would rotate Vault's DB password again each time).
#
# This is prod's three bootstrap steps in one Job, because stage starts empty:
#   1. master password -> memory volume (EKS pod identity; the role in Terraform rds-stage.tf may read
#      only the STAGE master secret, found through rds:DescribeDBInstances by instance name);
#   2. as master: create the `vault` role (LOGIN CREATEROLE, random password) and the group roles
#      weysure_owner / weysure_app with their grants (prod's v1 + db-grants-v2 SQL);
#   3. hand the `vault` role to Vault (database/config/weysure-stage), rotate its password so only
#      Vault knows it, and define the dynamic roles weysure-stage-app / weysure-stage-migrate.
# The empty `weysure` database itself is created by Terraform (module rds_stage, db_name).
#
# Needs BEFORE it runs (Adebayo, docs/runbooks/STAGING_ENVIRONMENT.md steps 1-3): terraform apply
# (database + IAM role + pod identity), and the Vault policy and Kubernetes auth role `db-bootstrap-stage`.
# Written to pass the Kyverno baseline that is Enforce in this namespace (non-root, read-only root
# filesystem, drop ALL, requests and limits): no jq, no apk, no openssl, so no root is needed.
# $$ is never written below: Kubernetes expands it (Finding 22), hence the named tag $body$.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-bootstrap-v1
  namespace: weysure-stage
spec:
  backoffLimit: 1
  template:
    metadata:
      # Matches the db-maintenance-egress NetworkPolicy: RDS 5432, HTTPS, pod identity, Vault 8200.
      labels: { app.kubernetes.io/name: db-maintenance }
    spec:
      serviceAccountName: db-bootstrap
      restartPolicy: Never
      nodeSelector: { node-role: workload }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: scratch
          emptyDir: { medium: Memory }   # RAM only - nothing survives the pod
      initContainers:
        - name: fetch-master-secret
          image: public.ecr.aws/aws-cli/aws-cli:2.22.35
          securityContext: &sc
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          env:
            - { name: AWS_REGION, value: us-east-1 }
            - { name: HOME, value: /scratch }
            - { name: DB_INSTANCE, value: weysure-stage-postgres }
          command: ["sh", "-ec"]
          args:
            - |
              umask 077
              SECRET_ARN=$(aws rds describe-db-instances --db-instance-identifier "$DB_INSTANCE" \
                --query 'DBInstances[0].MasterUserSecret.SecretArn' --output text)
              case "$SECRET_ARN" in arn:aws:secretsmanager:us-east-1:767397877316:secret:rds!*) ;; *) echo "unexpected master secret reference"; exit 1 ;; esac
              aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" \
                --query SecretString --output text > /scratch/master.json
              echo "stage master secret fetched"
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
          volumeMounts: [{ name: scratch, mountPath: /scratch }]
        - name: create-roles-and-grants
          image: postgres:16-alpine
          securityContext: *sc
          env:
            - { name: PGHOST, value: weysure-stage-postgres.cm7yqww8uycm.us-east-1.rds.amazonaws.com }
            - { name: PGPORT, value: "5432" }
            - { name: PGDATABASE, value: postgres }
            - { name: PGSSLMODE, value: require }   # rds.force_ssl=1 refuses anything less
            - { name: HOME, value: /scratch }
          command: ["sh", "-ec"]
          args:
            - |
              umask 077
              # RDS-managed passwords never contain a double quote, so a sed extract is safe (no jq: no root, no apk).
              export PGUSER=$(sed -n 's/.*"username":"\([^"]*\)".*/\1/p' /scratch/master.json)
              export PGPASSWORD=$(sed -n 's/.*"password":"\([^"]*\)".*/\1/p' /scratch/master.json | sed 's/\\\\/\\/g')
              VAULT_PW=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 40)
              printf '%s' "$VAULT_PW" > /scratch/vault-role.pw
              cat > /scratch/roles.sql <<'SQL'
              -- Run as the RDS master. Idempotent.
              DO $body$ BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'vault') THEN CREATE ROLE vault WITH LOGIN CREATEROLE; END IF;
              END $body$;
              ALTER ROLE vault WITH PASSWORD :'pw';
              GRANT vault TO CURRENT_USER;                       -- master created vault -> holds ADMIN on it
              SET createrole_self_grant = 'set, inherit';       -- roles vault creates are granted back to vault
              SET ROLE vault;
              DO $body$ BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'weysure_owner') THEN CREATE ROLE weysure_owner NOLOGIN; END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'weysure_app')   THEN CREATE ROLE weysure_app   NOLOGIN; END IF;
              END $body$;
              RESET ROLE;                                        -- grants below need the database/schema OWNER: master
              GRANT ALL PRIVILEGES ON DATABASE weysure TO vault;
              GRANT ALL PRIVILEGES ON DATABASE weysure TO weysure_owner;
              GRANT CONNECT       ON DATABASE weysure TO weysure_app;
              \c weysure
              GRANT ALL   ON SCHEMA public TO weysure_owner;
              GRANT USAGE ON SCHEMA public TO weysure_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE weysure_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES    TO weysure_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE weysure_owner IN SCHEMA public GRANT USAGE, SELECT               ON SEQUENCES TO weysure_app;
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES    IN SCHEMA public TO weysure_app;
              GRANT USAGE, SELECT               ON ALL SEQUENCES IN SCHEMA public TO weysure_app;
              SELECT d.datname, pg_get_userbyid(d.datdba) AS db_owner, pg_get_userbyid(n.nspowner) AS public_schema_owner
                FROM pg_database d, pg_namespace n WHERE d.datname = current_database() AND n.nspname = 'public';
              SQL
              psql -v ON_ERROR_STOP=1 -q -v pw="$VAULT_PW" -f /scratch/roles.sql
              rm -f /scratch/master.json /scratch/roles.sql
              echo "roles ready: vault, weysure_owner, weysure_app"
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
          volumeMounts: [{ name: scratch, mountPath: /scratch }]
      containers:
        - name: configure-vault-db-engine
          image: hashicorp/vault:1.20.4
          securityContext: *sc
          env:
            - { name: VAULT_ADDR, value: "http://vault.vault.svc:8200" }
            - { name: PGHOST, value: weysure-stage-postgres.cm7yqww8uycm.us-east-1.rds.amazonaws.com }
            - { name: HOME, value: /scratch }
          command: ["sh", "-ec"]
          args:
            - |
              JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              export VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login role=db-bootstrap-stage jwt="$JWT")
              # The `database` engine is already enabled (prod); this role may only touch the stage paths.
              vault write database/config/weysure-stage \
                plugin_name=postgresql-database-plugin \
                allowed_roles="weysure-stage-app,weysure-stage-migrate" \
                connection_url="postgresql://{{username}}:{{password}}@${PGHOST}:5432/weysure?sslmode=require" \
                username="vault" \
                password="$(cat /scratch/vault-role.pw)"
              rm -f /scratch/vault-role.pw
              # From here, only Vault knows the vault role's password.
              vault write -f database/rotate-root/weysure-stage
              # Same statements as prod's weysure-app / weysure-migrate (db-grants-v2), stage names.
              vault write database/roles/weysure-stage-app \
                db_name=weysure-stage default_ttl=1h max_ttl=24h \
                creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}' IN ROLE weysure_app;" \
                revocation_statements="DROP ROLE IF EXISTS \"{{name}}\";"
              vault write database/roles/weysure-stage-migrate \
                db_name=weysure-stage default_ttl=30m max_ttl=1h \
                creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}' IN ROLE weysure_owner; ALTER ROLE \"{{name}}\" SET role = 'weysure_owner';" \
                revocation_statements="DROP ROLE IF EXISTS \"{{name}}\";"
              echo "--- proof: mint an app credential (username only) ---"
              vault read -field=username database/creds/weysure-stage-app
              echo "stage db bootstrap complete"
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
          volumeMounts: [{ name: scratch, mountPath: /scratch }]
