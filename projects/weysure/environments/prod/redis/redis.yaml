# Redis for cache and rate limiting. Not durable state: losing it costs a
# cold cache, not data. In-cluster rather than ElastiCache (~$12/mo saved).
#
# Official redis image, not the Bitnami chart: Bitnami restricted free pulls
# of its images in 2025 and charts pinned to docker.io/bitnami/* now fail
# with "manifest unknown" for many tags. One StatefulSet is 50 lines and has
# no upstream licensing dependency.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: weysure-prod
spec:
  clusterIP: None            # headless: stable DNS redis-0.redis.weysure-prod.svc
  selector: { app: redis }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: weysure-prod
spec:
  serviceName: redis
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata:
      labels: { app: redis }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      containers:
        - name: redis
          image: redis:8.2-alpine
          args:
            - --appendonly
            - "yes"              # survive a pod restart; still not a database
            - --maxmemory
            - 200mb
            - --maxmemory-policy
            - allkeys-lru        # cache semantics: evict, never refuse writes
          ports: [{ name: redis, containerPort: 6379 }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 256Mi }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 15
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3
        resources: { requests: { storage: 2Gi } }
