# weysure-api on beyric-prod. Rendered by charts/beyric-app; the image tag comes
# from ../../images.yaml (imageTagKey) which Jenkins updates on every green build.
image:
  repository: 767397877316.dkr.ecr.us-east-1.amazonaws.com/weysure-api
imageTagKey: api

envFromSecrets: [weysure-app-config]

externalSecret:
  enabled: true
  name: weysure-app-config
  vaultPath: weysure/prod

vaultAgent:
  role: weysure-api
  dbCredsPath: database/creds/weysure-app
  # 2026-10-08 recovery: weysure-postgres (us-east-1a) could not be started -
  # InsufficientDBInstanceCapacity for db.t4g.micro in every AZ. Point-in-time
  # restore (to 2026-10-06 23:09:30 UTC, the sleep) as weysure-postgres-v2,
  # db.t3.micro in us-east-1b. The old instance is kept, stopped, untouched.
  dbHost: weysure-postgres-v2.cm7yqww8uycm.us-east-1.rds.amazonaws.com
  dbName: weysure

migration:
  enabled: true
  vaultRole: weysure-migrate
  dbCredsPath: database/creds/weysure-migrate
  command: ["/bin/bash", "-c", "set -a; . \"$VAULT_ENV_FILE\"; set +a; cd /app && alembic upgrade head"]
  # Nothing but DATABASE_URL (from the Vault file above). Since Weysure-API #12
  # alembic no longer imports the application's Settings, so the Job carries no
  # SECRET_KEY and no app config. Proven 2026-10-01 on the deployed commit:
  # 49 migrations from an empty database with DATABASE_URL as the only variable.
  # 15 min (chart default 10). Weysure-API #75 builds ix_users_lower_email with
  # CREATE INDEX CONCURRENTLY: up to 300 s waiting on older transactions plus the
  # build. A kill mid-build leaves an INVALID index and a failed PreSync (backoff 0).
  # Stays well inside the weysure-migrate Vault lease (ttl 30m).
  activeDeadlineSeconds: 900

# Non-secret configuration shared by the API workloads (api, api-worker).
commonEnv: &commonEnv
  # Pre-launch: real infrastructure, test provider keys, data wiped before launch.
  # Not production: from Weysure-API #36 the API refuses to boot with
  # ENVIRONMENT=production/prod while Dojah points at sandbox. Never development, dev,
  # test, testing or local: those switch on fake KYC/SMS providers, and test also
  # turns off rate limiting. Launch day: production, together with live Dojah keys.
  ENVIRONMENT: prelaunch
  # Domain cutover phase B (infra-tools plans/2026-10-15-domain-cutover-weysure-com.md):
  # links and payment_url use the new hosts; CORS admits both web origins until the old
  # web host redirects to weysure.com (phase C).
  SERVER_HOST: https://api.weysure.com
  FRONTEND_URL: https://weysure.com
  BACKEND_CORS_ORIGINS: '["https://weysure.com", "https://weysure.beyrictech.com"]'
  REDIS_URL: redis://redis:6379/0
  RUN_MIGRATIONS: "false"          # the PreSync Job owns migrations (spec D3)
  WEB_CONCURRENCY: "2"
  WALLET_RECONCILIATION_SCHEDULER_ENABLED: "false"
  # Wallet origins (Weysure-API feat/wallet-origins, migration 9f1d6a2b8e47): "false" =
  # origin lots are tracked but never enforced. Written out so that switching it on,
  # and the rollback (back to "false", never an image revert), is a one-line diff.
  # On since 2026-10-13: web 7c (#48, `4b9e2223c440`) live and checked by the developers;
  # 24 h of reconciliation runs with 0 wallet_lot_drift, 0 mismatches, 0 errors.
  ORIGIN_RULES_ENFORCED: "true"

  # Risk holds (Weysure-API #64, not deployed yet): written out off, so the starting state
  # is in git, not in code defaults. Ignored by images before #64. Each later stage
  # (capture, shadow, enforce) is its own reviewed change. enforce needs the flag above.
  RISK_HOLDS_MODE: "off"
  RISK_SIGNALS_CAPTURE_ENABLED: "false"
  # Socket peers allowed to vouch for CF-Connecting-IP (Weysure-API #66, not deployed yet).
  # The VPC: only Traefik (behind the Cloudflare-only NLB, gitops #69) reaches the API.
  # A platform fact, so it lives here, not as a code default. Ignored by earlier images.
  TRUSTED_PROXY_CIDRS: "10.0.0.0/16"
  # WebSocket auth (Weysure-API #89, web #56): the JWT travels in Sec-WebSocket-Protocol
  # ["weysure.bearer", "<jwt>"], never in the URL. false refuses any handshake that carries
  # ?token= (close 1008), so a token never lands in Traefik/uvicorn access logs.
  # Off since 2026-10-26: web Train 2 (#66) live, connects proven without ?token=,
  # developers confirmed no other client. Rollback: "true" (code default).
  WS_ALLOW_URL_TOKEN: "false"

  # Live-key auto-pause (Weysure-API #128 A5; the minimum-amount floor on every rule, #129, live
  # 2026-10-29): off | shadow | enforce. enforce pauses a non-KYB developer's live keys when a rule
  # fires (velocity / refund ratio / same payer, deals of N5,000 or more); only a superadmin resumes.
  # Adebayo chose enforce directly on 2026-10-29 (the developers' note suggested shadow first), after
  # a counts-only pre-switch read. Rollback: "shadow" (logs, pauses nobody) or "off"; keys already
  # paused stay paused until a superadmin resumes them.
  LIVE_AUTO_PAUSE_MODE: "enforce"

  # --- KYC phase 2: phone verification by SMS (Termii) -------------------------
  # Not secret. The secret half (TERMII_API_KEY) is in Vault secret/weysure/prod.
  # Read by the app from Weysure-API "kyc-p2" on; ignored by earlier images.
  TERMII_BASE_URL: https://v4.api.termii.com/      # this account's host, from the Termii dashboard
  TERMII_SENDER_ID: N-Alert                        # exact case: Termii matches the registered sender ID
  TERMII_OTP_CHANNEL: dnd
  # "Luran" is the brand the SMS route is registered under for now (Adebayo, 2026-10-02).
  # Must stay character-for-character the template Termii approved for the DND
  # route, or messages are rejected. {code} is required; {minutes} is filled from
  # OTP_EXPIRE_MINUTES - which must therefore stay 10 while the approved text says so.
  TERMII_OTP_TEMPLATE: "Your Luran verification code is {code}. Enter this to verify your phone number. Valid for {minutes} minutes. Do not share this code with anyone."
  OTP_EXPIRE_MINUTES: "10"
  OTP_RESEND_COOLDOWN_SECONDS: "60"
  OTP_RESEND_DAILY_CAP: "5"

  # --- KYC phase 3: identity verification (Dojah) ------------------------------
  # Account identifiers and the PUBLIC key: not secret. DOJAH_API_KEY,
  # DOJAH_WEBHOOK_SECRET and KYC_FINGERPRINT_KEY are in Vault.
  # 2026-10-09: new Dojah sandbox app - app ID, public key and both widget IDs
  # here, API key and webhook secret in Vault, changed together. The webhook
  # secret is now separate from the API key (until then they were equal).
  # SANDBOX on purpose (2026-10-02): no real users yet; production checks hit real
  # BVN/NIN records and are billed per check. At launch change DOJAH_ENVIRONMENT to
  # production, DOJAH_BASE_URL to https://api.dojah.io, the public key to the live
  # one here and the API key in Vault - together: a sandbox key on the production
  # host answers a misleading 401.
  DOJAH_ENVIRONMENT: sandbox
  DOJAH_BASE_URL: https://sandbox.dojah.io
  DOJAH_APP_ID: 6ac8ffaff6fcadcd5efb83b6
  DOJAH_PUBLIC_KEY: test_pk_HYVen9WbfYaZkLXgBSR39SEEI
  DOJAH_BVN_WIDGET_ID: 6ac903aef6fcadcd5efb95e0
  DOJAH_NIN_WIDGET_ID: 6ac90a7012645c3992709361
  DOJAH_FACE_MATCH_THRESHOLD: "70"

components:
  api:
    replicas: 2
    port: 8000
    vaultAgent: true
    env: *commonEnv
    ingress: { enabled: true, host: weysure-api.beyrictech.com, extraHosts: [api.weysure.com] }
    probes: { path: /api/v1/health }
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    hpa: { enabled: true, minReplicas: 2, maxReplicas: 4, cpu: 70 }
    pdb: { enabled: true, minAvailable: 1 }
    # Never two replicas on one node (2026-10-13): with the default soft rule all
    # api and web pods sat on one spot node, so one spot interruption took both
    # sites down at once. Karpenter adds a node when no second one has room.
    # minDomains 2 (2026-10-16): the rule counts only nodes the pod may use
    # (node-role=workload). After Karpenter consolidated down to one workload
    # node, one node was "balanced" and all replicas sat on it again.
    topologySpread: { whenUnsatisfiable: DoNotSchedule, minDomains: 2 }
    terminationGracePeriodSeconds: 60
    # The application writes nothing to disk (Weysure-API #14: logs to stdout;
    # #16: uploads to Cloudinary), so /tmp is the only writable path left.
    writableDirs: [/tmp]
  # api-scheduler removed 2026-10-26: idle since Weysure-API #68 (the reconciliation loop runs in
  # api-worker as the wallet.reconciliation job), replicas 0 since 2026-10-24 (gitops #89).
  # Background jobs worker (platform note 2026-10-03b): polls the Postgres jobs
  # table with FOR UPDATE SKIP LOCKED, so replicas never share a job. Same image
  # as api (needs Weysure-API #43 or later: app.worker). Switched on 2026-10-05.
  # Alerts: DeploymentReplicasMissing, and the Loki rules in
  # platform/monitoring/loki-rules-jobs.yaml (from its jobs_stats log line).
  api-worker:
    enabled: true
    replicas: 1
    vaultAgent: true
    # Weysure-API #68: the reconciliation loop runs here as one recurring job
    # (wallet.reconciliation), every 30 min.
    env:
      <<: *commonEnv
      WALLET_RECONCILIATION_SCHEDULER_ENABLED: "true"
      WALLET_RECONCILIATION_INTERVAL_MINUTES: "30"
      WALLET_RECONCILIATION_NOTIFY_COOLDOWN_MINUTES: "60"   # alert: platform/monitoring/loki-rules-wallet.yaml
    # No port: no Service, no readiness, no preStop sleep.
    # The image's CMD (/opt/run.sh) starts gunicorn, so the worker replaces it and
    # does the Vault step run.sh does: wait for the rendered credential, export it.
    command:
      - /bin/bash
      - -c
      - |
        for i in $(seq 1 60); do [[ -s "$VAULT_ENV_FILE" ]] && break; sleep 1; done
        [[ -s "$VAULT_ENV_FILE" ]] || { echo "$VAULT_ENV_FILE was not rendered"; exit 1; }
        set -a; . "$VAULT_ENV_FILE"; set +a
        cd /app && exec python -m app.worker
    # When the DB lease is renewed past max TTL, the agent re-renders the file and
    # SIGTERMs the worker; it finishes its current job, exits, and the container
    # restarts with the new credential (same mechanism as api's gunicorn).
    # Anchored (^): the agent also runs this on its FIRST render, while the bash
    # wrapper above is still waiting - and the wrapper's command line contains the
    # text "app.worker". Unanchored, it killed the wrapper on every pod start
    # (exit 143, one restart; seen 2026-10-05). Only the exec'd process starts
    # with "python -m app.worker".
    vaultRestartCommand: sh -c "pkill -TERM -f '^python -m app[.]worker' || true"
    # Liveness: the worker touches /tmp/worker-heartbeat; older than 45s = stuck.
    probes:
      exec: [sh, -c, 'test $(( $(date +%s) - $(stat -c %Y /tmp/worker-heartbeat) )) -lt 45']
    terminationGracePeriodSeconds: 60   # SIGTERM -> finish the running job -> exit
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }
    writableDirs: [/tmp]
