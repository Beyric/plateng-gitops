# Everything the nightly off-AWS database backup needs from Vault. Nothing here is a value.
#
# dataFrom.extract (docs/conventions/EXTERNAL_SECRETS.md): every key at the Vault path lands
# in the Secret under its Vault name. ONE consumer owns this path - the backup CronJob and its
# one-shot role Job. Do not add a key another workload needs; do not read this path elsewhere.
#
#   Vault path   secret/weysure/backup   (ESO policy weysure-read already covers secret/weysure/*)
#   key                          what it is
#   PGPASSWORD                   password of the read-only database role weysure_backup. Generated by
#                                Adebayo; db-backup-role-v1 sets the role to it, the CronJob logs in with it.
#   AGE_RECIPIENT                the owner's age PUBLIC key (age1...). The private key never exists here.
#   RCLONE_CONFIG_GDRIVE_TOKEN   rclone's Google Drive OAuth token JSON (from `rclone config`).
#   RCLONE_CONFIG_GDRIVE_CLIENT_ID / _CLIENT_SECRET   the owner's own Google OAuth client (Desktop app, consent
#                                screen published). rclone's shared client is being retired during 2026.
#
# Each container reads only the keys it needs, through secretKeyRef (not envFrom). Procedure:
# docs/runbooks/DB_OFFSITE_BACKUP.md in plateng-infrastructure-tools.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weysure-backup
  namespace: weysure-prod
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target: { name: weysure-backup, creationPolicy: Owner }
  dataFrom:
    - extract: { key: weysure/backup }
