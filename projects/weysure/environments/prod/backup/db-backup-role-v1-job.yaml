# One-shot (ADR-022: plain Job, no hook, no TTL - Argo applies it once and it stays Complete as the
# record). Creates the READ-ONLY database role the nightly off-AWS backup logs in as, in the same
# style as db-grants-v2 / db-orphan-roles-v1: as the RDS master, fetched from Secrets Manager by
# Pod Identity (ServiceAccount db-bootstrap), never by hand and never inside a running app pod.
#
#   weysure_backup  LOGIN, no superuser/createdb/createrole/replication, 3 connections,
#                   default_transaction_read_only = on. Password = Vault secret/weysure/backup key PGPASSWORD.
#   grants          CONNECT on weysure, USAGE on public, SELECT on every table and sequence now,
#                   and - via default privileges of weysure_owner (the role migrations run as) - on every
#                   one created later, so tonight's backup does not break on next week's migration.
#   self-check      fails the Job (loudly) unless the role can SELECT every table and sequence, has USAGE
#                   on every schema, no row-level-security table would block pg_dump, future tables are
#                   covered, and it can actually log in. Prints names/counts only, never the password.
#
# Idempotent. To rotate the password: change PGPASSWORD in Vault, then add db-backup-role-v2 (copy this
# file) in a new PR - a Job is immutable, so a re-run is a new Job name.
# Needs Vault secret/weysure/backup to exist first (Argo holds this Job until the ExternalSecret is Ready).
apiVersion: batch/v1
kind: Job
metadata:
  name: db-backup-role-v1
  namespace: weysure-prod
  annotations:
    # Wave 1: after the ExternalSecret (wave 0) is Ready, so the Secret exists when the pod starts.
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: { app.kubernetes.io/name: db-maintenance }
    spec:
      serviceAccountName: db-bootstrap
      restartPolicy: Never
      nodeSelector: { node-role: workload }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: scratch
          emptyDir: { medium: Memory }
      initContainers:
        - name: fetch-master-secret
          image: public.ecr.aws/aws-cli/aws-cli:2.22.35
          securityContext: &sc
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
          env:
            - { name: AWS_REGION, value: us-east-1 }
            - { name: HOME, value: /scratch }
            # The master secret of weysure-postgres-v2 (the live instance since the 2026-10-08 recovery);
            # the db-bootstrap role's IAM policy allows exactly this ARN (Terraform rds.tf).
            - { name: SECRET_ARN, value: "arn:aws:secretsmanager:us-east-1:767397877316:secret:rds!db-f174bb4b-18cf-4273-be3b-a82b2155457c-gkjpNZ" }
          command: ["sh", "-ec"]
          args:
            - |
              umask 077
              aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" \
                --query SecretString --output text > /scratch/master.json
              echo "master secret fetched"
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
          volumeMounts: [{ name: scratch, mountPath: /scratch }]
      containers:
        - name: create-backup-role
          image: postgres:16.16-alpine3.23@sha256:a23cda8ed4733a74cd0a328fcb525a43c35cdbaa845b6fdb8f343646f995cc1e
          securityContext: *sc
          env:
            - { name: PGHOST, value: weysure-postgres-v2.cm7yqww8uycm.us-east-1.rds.amazonaws.com }
            - { name: PGPORT, value: "5432" }
            - { name: PGDATABASE, value: postgres }
            - { name: PGSSLMODE, value: require }
            - { name: HOME, value: /scratch }
            - name: BACKUP_PASSWORD
              valueFrom: { secretKeyRef: { name: weysure-backup, key: PGPASSWORD } }
          command: ["sh", "-ec"]
          args:
            - |
              umask 077
              [ "${#BACKUP_PASSWORD}" -ge 24 ] || { echo "PGPASSWORD in Vault secret/weysure/backup is missing or shorter than 24 characters"; exit 1; }
              # RDS-managed passwords never contain a double quote, so a sed extract is safe; no jq (no root, no apk).
              export PGUSER=$(sed -n 's/.*"username":"\([^"]*\)".*/\1/p' /scratch/master.json)
              export PGPASSWORD=$(sed -n 's/.*"password":"\([^"]*\)".*/\1/p' /scratch/master.json | sed 's/\\\\/\\/g')
              cat > /scratch/backup-role.sql <<'SQL'
              -- Run as the RDS master. Idempotent. The password reaches psql as a variable read from the
              -- environment (\getenv), so it is never written to a file or to this script.
              \set ON_ERROR_STOP on
              \getenv backup_pw BACKUP_PASSWORD
              SELECT NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'weysure_backup') AS need_create \gset
              \if :need_create
                CREATE ROLE weysure_backup LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 3;
              \endif
              ALTER ROLE weysure_backup WITH LOGIN PASSWORD :'backup_pw' CONNECTION LIMIT 3;
              ALTER ROLE weysure_backup SET default_transaction_read_only = on;
              GRANT CONNECT ON DATABASE weysure TO weysure_backup;
              \c weysure
              GRANT USAGE  ON SCHEMA public TO weysure_backup;
              GRANT SELECT ON ALL TABLES    IN SCHEMA public TO weysure_backup;
              GRANT SELECT ON ALL SEQUENCES IN SCHEMA public TO weysure_backup;
              ALTER DEFAULT PRIVILEGES FOR ROLE weysure_owner IN SCHEMA public GRANT SELECT ON TABLES    TO weysure_backup;
              ALTER DEFAULT PRIVILEGES FOR ROLE weysure_owner IN SCHEMA public GRANT SELECT ON SEQUENCES TO weysure_backup;

              -- Self-check: anything pg_dump needs that this role cannot do fails the Job now, not at 02:30.
              DO $check$
              DECLARE problems text;
              BEGIN
                SELECT string_agg(format('%I.%I (owner %s)', n.nspname, c.relname, pg_get_userbyid(c.relowner)), ', ')
                  INTO problems
                  FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                 WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') AND n.nspname NOT LIKE 'pg_toast%' AND n.nspname NOT LIKE 'pg_temp%'
                   AND ((c.relkind IN ('r', 'p', 'm') AND NOT has_table_privilege('weysure_backup', c.oid, 'SELECT'))
                     OR (c.relkind = 'S' AND NOT has_sequence_privilege('weysure_backup', c.oid, 'SELECT')));
                IF problems IS NOT NULL THEN RAISE EXCEPTION 'weysure_backup cannot SELECT: %', problems; END IF;

                SELECT string_agg(n.nspname, ', ') INTO problems FROM pg_namespace n
                 WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') AND n.nspname NOT LIKE 'pg_toast%' AND n.nspname NOT LIKE 'pg_temp%'
                   AND NOT has_schema_privilege('weysure_backup', n.oid, 'USAGE');
                IF problems IS NOT NULL THEN RAISE EXCEPTION 'weysure_backup has no USAGE on schema(s): %', problems; END IF;

                SELECT string_agg(c.relname, ', ') INTO problems FROM pg_class c
                 WHERE c.relkind IN ('r', 'p') AND c.relrowsecurity;
                IF problems IS NOT NULL THEN RAISE EXCEPTION 'row-level security would make pg_dump fail on: %', problems; END IF;

                IF NOT EXISTS (SELECT 1 FROM pg_default_acl d JOIN pg_namespace n ON n.oid = d.defaclnamespace
                                WHERE pg_get_userbyid(d.defaclrole) = 'weysure_owner' AND n.nspname = 'public'
                                  AND d.defaclobjtype = 'r' AND d.defaclacl::text LIKE '%weysure_backup=r/weysure_owner%') THEN
                  RAISE EXCEPTION 'future tables created by weysure_owner would not be readable by weysure_backup';
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_default_acl d JOIN pg_namespace n ON n.oid = d.defaclnamespace
                                WHERE pg_get_userbyid(d.defaclrole) = 'weysure_owner' AND n.nspname = 'public'
                                  AND d.defaclobjtype = 'S' AND d.defaclacl::text LIKE '%weysure_backup=r/weysure_owner%') THEN
                  RAISE EXCEPTION 'future sequences created by weysure_owner would not be readable by weysure_backup';
                END IF;
              END $check$;

              SELECT (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind IN ('r', 'p')) AS public_tables_readable,
                     (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'S') AS public_sequences_readable,
                     (SELECT rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication FROM pg_roles WHERE rolname = 'weysure_backup') AS has_elevated_attributes;
              SQL
              psql -v ON_ERROR_STOP=1 -q -f /scratch/backup-role.sql
              rm -f /scratch/backup-role.sql
              # Last proof: the new role can log in with the Vault password and is read-only.
              # (the master credentials are swapped out first; the subshell keeps them from leaking.)
              ( export PGUSER=weysure_backup PGPASSWORD="$BACKUP_PASSWORD" PGDATABASE=weysure
                psql -Atq -c "select 'login-ok user=' || current_user || ' read_only=' || current_setting('default_transaction_read_only')" )
              rm -f /scratch/master.json
              echo "backup role ready: weysure_backup (read-only)"
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
          volumeMounts: [{ name: scratch, mountPath: /scratch }]
