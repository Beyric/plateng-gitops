# One-shot follow-up to db-bootstrap (Finding 32). PostgreSQL 16 removed a
# role's implicit ADMIN OPTION on itself, so the Phase 5 weysure-migrate role
# (`IN ROLE vault`) fails with "permission denied to grant role vault".
#
# New layout, the canonical one for Vault dynamic credentials:
#   weysure_owner  NOLOGIN  owns every table (migrate users SET ROLE into it)
#   weysure_app    NOLOGIN  DML on everything weysure_owner creates (default privileges)
# Both are created *by* vault, so vault holds ADMIN on them and can grant them
# to the short-lived users it mints. Ephemeral users own nothing; revocation is
# a plain DROP ROLE. Proven locally against postgres:16 with a non-superuser master.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-roles-pg16
  namespace: weysure-prod
  # Deliberately NOT an Argo hook and NO ttlSecondsAfterFinished (Finding 33):
  # a hook with HookSucceeded is re-created - and re-run - on every sync, and a
  # TTL-deleted Job is re-created by the next sync. A plain Job is immutable:
  # Argo applies it once and it stays Complete as the record of what ran.
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: db-bootstrap
      restartPolicy: Never
      volumes:
        - name: scratch
          emptyDir: { medium: Memory }
      initContainers:
        - name: fetch-master-secret
          image: public.ecr.aws/aws-cli/aws-cli:2.22.35
          env:
            - { name: AWS_REGION, value: us-east-1 }
            - { name: SECRET_ARN, value: "arn:aws:secretsmanager:us-east-1:767397877316:secret:rds!db-c396f13d-c4f7-4672-8d0f-4b9929190102-SIlkgw" }
          command: ["sh", "-ec"]
          args:
            - |
              aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" \
                --query SecretString --output text > /scratch/master.json
              echo "master secret fetched"
          volumeMounts: [{ name: scratch, mountPath: /scratch }]
        - name: create-group-roles
          image: postgres:16-alpine
          env:
            - { name: PGHOST, value: weysure-postgres.cm7yqww8uycm.us-east-1.rds.amazonaws.com }
            - { name: PGPORT, value: "5432" }
            - { name: PGDATABASE, value: postgres }
            - { name: PGSSLMODE, value: require }
          command: ["sh", "-ec"]
          args:
            - |
              apk add --no-cache jq >/dev/null
              export PGUSER=$(jq -r .username /scratch/master.json)
              export PGPASSWORD=$(jq -r .password /scratch/master.json)
              cat > /scratch/roles.sql <<'SQL'
              -- Run as the RDS master user. Idempotent.
              -- Master created `vault` in Phase 5, so it holds ADMIN OPTION on it and may join it.
              GRANT vault TO CURRENT_USER;
              -- Roles vault creates below are granted back to vault with SET+INHERIT (PG16).
              SET createrole_self_grant = 'set, inherit';
              SET ROLE vault;
              DO $body$ BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'weysure_owner') THEN CREATE ROLE weysure_owner NOLOGIN; END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'weysure_app')   THEN CREATE ROLE weysure_app   NOLOGIN; END IF;
              END $body$;
              -- (vault, as creator, already holds ADMIN + SET/INHERIT on both via createrole_self_grant)
              GRANT ALL PRIVILEGES ON DATABASE weysure TO weysure_owner;
              GRANT CONNECT       ON DATABASE weysure TO weysure_app;
              \c weysure
              SET ROLE vault;
              GRANT ALL   ON SCHEMA public TO weysure_owner;
              GRANT USAGE ON SCHEMA public TO weysure_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE weysure_owner IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES    TO weysure_app;
              ALTER DEFAULT PRIVILEGES FOR ROLE weysure_owner IN SCHEMA public GRANT USAGE, SELECT               ON SEQUENCES TO weysure_app;
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES    IN SCHEMA public TO weysure_app;
              GRANT USAGE, SELECT               ON ALL SEQUENCES IN SCHEMA public TO weysure_app;
              SQL
              psql -v ON_ERROR_STOP=1 -q -f /scratch/roles.sql
              rm -f /scratch/master.json /scratch/roles.sql
              echo "group roles ready: weysure_owner, weysure_app"
          volumeMounts: [{ name: scratch, mountPath: /scratch }]
      containers:
        - name: update-vault-roles
          image: hashicorp/vault:1.20.4
          env:
            - { name: VAULT_ADDR, value: http://vault.vault.svc:8200 }
          command: ["sh", "-ec"]
          args:
            - |
              JWT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              export VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login role=db-bootstrap jwt="$JWT")
              # Application: member of weysure_app -> DML on everything the owner creates.
              vault write database/roles/weysure-app \
                db_name=weysure default_ttl=1h max_ttl=24h \
                creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}' IN ROLE weysure_app;" \
                revocation_statements="DROP ROLE IF EXISTS \"{{name}}\";"
              # Migrations: member of weysure_owner and switches into it at login,
              # so alembic's tables are owned by the group, not the 30-minute user.
              vault write database/roles/weysure-migrate \
                db_name=weysure default_ttl=30m max_ttl=1h \
                creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}' IN ROLE weysure_owner; ALTER ROLE \"{{name}}\" SET role = 'weysure_owner';" \
                revocation_statements="DROP ROLE IF EXISTS \"{{name}}\";"
              echo "--- proof: mint an app credential (username only) ---"
              vault read -field=username database/creds/weysure-app
              echo "db roles updated for PostgreSQL 16"
