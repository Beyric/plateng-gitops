# Phase 8 (spec D7). Ceiling for the namespace so a runaway HPA or a bad values
# change cannot take the cluster; defaults only apply to pods that omit them
# (the beyric-app chart always sets requests and limits).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: weysure-prod
  namespace: weysure-prod
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: weysure-prod-defaults
  namespace: weysure-prod
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }
      default: { cpu: 500m, memory: 512Mi }
