# Phase 8 (spec D7). Ceiling for the namespace so a runaway HPA or a bad values
# change cannot take the cluster; defaults only apply to pods that omit them
# (the beyric-app chart always sets requests and limits).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: weysure-prod
  namespace: weysure-prod
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    # 10 (was 8, 2026-10-24): room for api + api-scheduler + api-worker to surge together with
    # the api HPA at its max of 4 (9.4 worst case). Limits do not cost money (Karpenter sizes
    # nodes by requests); requests.cpu stays the real ceiling.
    limits.cpu: "10"
    limits.memory: 12Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: weysure-prod-defaults
  namespace: weysure-prod
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }
      default: { cpu: 500m, memory: 512Mi }
