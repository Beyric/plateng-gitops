# Phase 8 (spec D5). Enforce in weysure-prod (2026-09-21, after a clean audit: 219 pass,
# 0 fail across a release, a migration and three one-shot Jobs); Audit everywhere else.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/description: "Images must use a fixed tag, never :latest or untagged (Finding 11)."
spec:
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        failureActionOverrides:
          - action: Enforce
            namespaces: [weysure-prod]
        message: "Every image must carry an explicit tag or digest."
        pattern:
          spec:
            containers:
              - image: "*:*"
    - name: no-latest-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        failureActionOverrides:
          - action: Enforce
            namespaces: [weysure-prod]
        message: "The :latest tag is not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
