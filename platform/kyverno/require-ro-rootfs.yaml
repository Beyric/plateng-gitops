# Phase 8 (spec D5). Enforce in weysure-prod (2026-09-21, after a clean audit: 219 pass,
# 0 fail across a release, a migration and three one-shot Jobs); Audit everywhere else.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-ro-rootfs
  annotations:
    policies.kyverno.io/description: "Root filesystem is read-only; writable paths are explicit volumes."
spec:
  background: true
  rules:
    - name: require-ro-rootfs
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        failureActionOverrides:
          - action: Enforce
            namespaces: [weysure-prod]
        message: "securityContext.readOnlyRootFilesystem must be true."
        pattern:
          spec:
            containers:
              - securityContext: { readOnlyRootFilesystem: true }
