# Phase 8 (spec D5). Enforce in weysure-prod (2026-09-21, after a clean audit: 219 pass,
# 0 fail across a release, a migration and three one-shot Jobs); Audit everywhere else.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged
  annotations:
    policies.kyverno.io/description: "No privileged containers, no privilege escalation."
spec:
  background: true
  rules:
    - name: disallow-privileged
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        failureActionOverrides:
          - action: Enforce
            namespaces: [weysure-prod]
        message: "privileged and allowPrivilegeEscalation must be false."
        pattern:
          spec:
            containers:
              - securityContext:
                  =(privileged): "false"
                  =(allowPrivilegeEscalation): "false"
