# Phase 8 (spec D5). Audit first; Enforce for weysure-prod after seven clean days.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/description: "Every container declares CPU/memory requests and a memory limit."
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-requests-limits
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Containers must set resources.requests.cpu/memory and resources.limits.memory."
        pattern:
          spec:
            containers:
              - resources:
                  requests: { cpu: "?*", memory: "?*" }
                  limits: { memory: "?*" }
