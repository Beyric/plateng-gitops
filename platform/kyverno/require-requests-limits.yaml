# Phase 8 (spec D5). Enforce in weysure-prod (2026-09-21, after a clean audit: 219 pass,
# 0 fail across a release, a migration and three one-shot Jobs); Audit everywhere else.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/description: "Every container declares CPU/memory requests and a memory limit."
spec:
  background: true
  rules:
    - name: require-requests-limits
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        failureActionOverrides:
          - action: Enforce
            namespaces: [weysure-prod]
        message: "Containers must set resources.requests.cpu/memory and resources.limits.memory."
        pattern:
          spec:
            containers:
              - resources:
                  requests: { cpu: "?*", memory: "?*" }
                  limits: { memory: "?*" }
