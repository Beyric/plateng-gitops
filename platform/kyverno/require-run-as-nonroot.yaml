# Phase 8 (spec D5). Enforce in weysure-prod (2026-09-21, after a clean audit: 219 pass,
# 0 fail across a release, a migration and three one-shot Jobs); Audit everywhere else.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/description: "Pods run as a non-root user."
spec:
  background: true
  rules:
    - name: require-run-as-nonroot
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        failureAction: Audit
        failureActionOverrides:
          - action: Enforce
            namespaces: [weysure-prod]
        message: "runAsNonRoot must be true at pod or container level."
        anyPattern:
          - spec:
              securityContext: { runAsNonRoot: true }
          - spec:
              containers:
                - securityContext: { runAsNonRoot: true }
