# What Karpenter is allowed to provision, and when it takes nodes away.
#
# Spot-first with an on-demand fallback: spot is 65-70% cheaper and AWS gives
# two minutes' notice, which Karpenter handles through the SQS queue Terraform
# created. Stateful platform components stay on the on-demand `system` node
# group instead, via nodeSelector.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        node-role: workload
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["m", "c", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"]
        # 2-8 vCPU. Below 2 cannot hold SonarQube; above 8 wastes money when a
        # single small pod is pending.
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4", "8"]
      expireAfter: 720h
  # The ceiling that stops a runaway Deployment from provisioning the account
  # into the budget alarm.
  limits:
    cpu: "32"
    memory: 128Gi
  disruption:
    # Terminate empty nodes, and repack underutilised ones onto fewer instances.
    # This is what makes a bursty workload like SonarQube affordable.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "10%"
