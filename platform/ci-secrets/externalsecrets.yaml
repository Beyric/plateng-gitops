---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: sonar-postgres, namespace: sonarqube }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target: { name: sonar-postgres, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: platform/sonarqube, property: db_password }
    - secretKey: monitoring-passcode
      remoteRef: { key: platform/sonarqube, property: monitoring_passcode }
