# Every secret CI needs, sourced from Vault. Nothing here is a value.
#
# dataFrom.extract, not data[] (ADR-019): every key at the Vault path lands in
# the Secret under its Vault name. Consumers reference Vault's key names
# directly. Guardrail: one Vault path serves ONE consumer - a key added to a
# path reaches every Secret extracted from it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: jenkins-platform, namespace: jenkins }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target: { name: jenkins-platform, creationPolicy: Owner }
  dataFrom:
    - extract: { key: platform/jenkins }      # admin_user admin_password webhook_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: jenkins-github-app, namespace: jenkins }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target: { name: jenkins-github-app, creationPolicy: Owner }
  dataFrom:
    - extract: { key: platform/github-app }   # app_id installation_id private_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: sonar-postgres, namespace: sonarqube }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target: { name: sonar-postgres, creationPolicy: Owner }
  dataFrom:
    - extract: { key: platform/sonarqube }    # db_password monitoring_passcode
