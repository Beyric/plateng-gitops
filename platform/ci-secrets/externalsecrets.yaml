# Every secret CI needs, sourced from Vault. Nothing here is a value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: jenkins-admin, namespace: jenkins }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target: { name: jenkins-admin, creationPolicy: Owner }
  data:
    - secretKey: jenkins-admin-user
      remoteRef: { key: platform/jenkins, property: admin_user }
    - secretKey: jenkins-admin-password
      remoteRef: { key: platform/jenkins, property: admin_password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: jenkins-github-app, namespace: jenkins }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target: { name: jenkins-github-app, creationPolicy: Owner }
  data:
    - secretKey: app_id
      remoteRef: { key: platform/github-app, property: app_id }
    - secretKey: installation_id
      remoteRef: { key: platform/github-app, property: installation_id }
    - secretKey: private_key
      remoteRef: { key: platform/github-app, property: private_key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: jenkins-webhook, namespace: jenkins }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target: { name: jenkins-webhook, creationPolicy: Owner }
  data:
