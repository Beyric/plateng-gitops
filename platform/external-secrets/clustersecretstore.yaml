# One store for the whole cluster. A namespaced SecretStore would have to be
# duplicated into every namespace that needs secrets; a ClusterSecretStore is
# declared once and referenced from anywhere.
#
# This is not a security hole. Authorisation happens in Vault, not here: the
# Kubernetes auth role binds to specific ServiceAccounts in specific namespaces,
# and the attached policy limits which paths those may read. A pod referencing
# this store still cannot read a path its policy does not allow.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "secret"
      version: v2
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          # ESO's own ServiceAccount authenticates to Vault. Must be named
          # explicitly for a ClusterSecretStore, which has no namespace of its own.
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
