# Phase 9. Secrets for the monitoring stack come from Vault through ESO
# (ADR-008/019). Alertmanager takes its whole config from a Secret
# (alertmanagerSpec.configSecret), so ESO renders alertmanager.yaml with the
# Slack webhook URLs in place; Grafana reads its admin password by key.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels: { vault-injection: disabled }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: grafana-admin, namespace: monitoring }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target: { name: grafana-admin, creationPolicy: Owner }
  data:
    - { secretKey: admin-user,     remoteRef: { key: platform/grafana, property: admin_user } }
    - { secretKey: admin-password, remoteRef: { key: platform/grafana, property: admin_password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: alertmanager-config, namespace: monitoring }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault, kind: ClusterSecretStore }
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
            slack_api_url: "{{ .slack_warning_url }}"
          route:
            receiver: slack-warning
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              # Dead-man's switch: Watchdog always fires; every notification pings
              # healthchecks.io, which alerts from OUTSIDE the cluster if the pings
              # stop (Prometheus, Alertmanager or the cluster is down).
              - receiver: healthchecks-watchdog
                matchers: [alertname = Watchdog]
                group_wait: 0s
                group_interval: 1m
                repeat_interval: 1m
              # InfoInhibitor (severity none) exists only to inhibit info alerts; never a page.
              - receiver: "null"
                matchers: [alertname = InfoInhibitor]
              - receiver: "null"
                matchers: [severity = none]
              - receiver: slack-critical
                matchers: [severity = critical]
                repeat_interval: 4h
              - receiver: "null"
                matchers: [severity = info]
          inhibit_rules:
            - source_matchers: [severity = critical]
              target_matchers: [severity =~ warning|info]
              equal: [namespace, alertname]
          receivers:
            - name: "null"
            - name: healthchecks-watchdog
              webhook_configs:
                - url: "{{ .watchdog_ping_url }}"
                  send_resolved: false
                  max_alerts: 1
            - name: slack-warning
              slack_configs:
                - channel: "#beyric-alerts-warning"
                  send_resolved: true
                  title: '{{ "{{" }} .CommonLabels.alertname {{ "}}" }} ({{ "{{" }} .Status {{ "}}" }})'
                  text: '{{ "{{" }} range .Alerts {{ "}}" }}• {{ "{{" }} .Annotations.summary {{ "}}" }}{{ "{{" }} if .Annotations.description {{ "}}" }} — {{ "{{" }} .Annotations.description {{ "}}" }}{{ "{{" }} end {{ "}}" }}{{ "{{" }} if .Annotations.runbook_url {{ "}}" }} <{{ "{{" }} .Annotations.runbook_url {{ "}}" }}|runbook>{{ "{{" }} end {{ "}}" }}
                  {{ "{{" }} end {{ "}}" }}'
            - name: slack-critical
              slack_configs:
                - api_url: "{{ .slack_critical_url }}"
                  channel: "#beyric-alerts-critical"
                  send_resolved: true
                  title: ':rotating_light: {{ "{{" }} .CommonLabels.alertname {{ "}}" }} ({{ "{{" }} .Status {{ "}}" }})'
                  text: '{{ "{{" }} range .Alerts {{ "}}" }}• {{ "{{" }} .Annotations.summary {{ "}}" }}{{ "{{" }} if .Annotations.description {{ "}}" }} — {{ "{{" }} .Annotations.description {{ "}}" }}{{ "{{" }} end {{ "}}" }}{{ "{{" }} if .Annotations.runbook_url {{ "}}" }} <{{ "{{" }} .Annotations.runbook_url {{ "}}" }}|runbook>{{ "{{" }} end {{ "}}" }}
                  {{ "{{" }} end {{ "}}" }}'
  dataFrom:
    - extract: { key: platform/alertmanager }   # slack_critical_url slack_warning_url watchdog_ping_url
