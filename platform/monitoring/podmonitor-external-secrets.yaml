# Phase 9. The external-secrets chart (2.10.0) ships no ServiceMonitor and only the
# webhook has a Service; all three controllers expose /metrics on a container
# port named `metrics` (8080), so a PodMonitor is the right shape.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: { name: external-secrets, namespace: monitoring }
spec:
  namespaceSelector: { matchNames: [external-secrets] }
  selector: { matchLabels: { app.kubernetes.io/instance: external-secrets } }
  podMetricsEndpoints:
    - { port: metrics, interval: 30s }
