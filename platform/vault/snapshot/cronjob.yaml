# Phase 10 (spec §3, D1). Daily Raft snapshot -> S3. Backing up Vault is our job:
# Raft lives on one PVC, and losing it loses every secret on the platform.
#
#   init  snapshot  Kubernetes-auth login (role vault-snapshot: read on
#                   sys/storage/raft/snapshot, 15 min token) -> /scratch/vault.snap
#   main  upload    Pod Identity (vault/vault-snapshot: put-only on the bucket)
#
# The snapshot is encrypted by the KMS auto-unseal key: without that key it is
# unreadable. Restore procedure: runbooks/RESTORE_DRILL.md. Alert if no success
# in 26 h: VaultSnapshotMissing (platform/monitoring/alerts.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-snapshot
  namespace: vault
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-snapshot
  namespace: vault
spec:
  schedule: "0 2 * * *"            # 02:00 UTC, an hour before the RDS backup window
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600    # a missed 02:00 (node roll, wake from sleep) still runs within the hour
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: { app.kubernetes.io/name: vault-snapshot }
        spec:
          serviceAccountName: vault-snapshot
          restartPolicy: Never
          # System nodes: always there. A backup must not depend on a spot node launching.
          nodeSelector: { node-role: system }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: scratch
              emptyDir: { sizeLimit: 1Gi }
          initContainers:
            - name: snapshot
              image: hashicorp/vault:1.20.4      # keep equal to platform/vault/values.yaml
              securityContext: &sc
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: [ALL] }
              env:
                # vault-active: a snapshot must come from the Raft leader.
                - { name: VAULT_ADDR, value: http://vault-active.vault.svc:8200 }
                - { name: HOME, value: /scratch }
              command: ["sh", "-ec"]
              args:
                - |
                  umask 077
                  VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login \
                    role=vault-snapshot \
                    jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)
                  export VAULT_TOKEN
                  vault operator raft snapshot save /scratch/vault.snap
                  test -s /scratch/vault.snap
                  echo "snapshot saved: $(wc -c < /scratch/vault.snap) bytes"
              resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
              volumeMounts: [{ name: scratch, mountPath: /scratch }]
          containers:
            - name: upload
              image: public.ecr.aws/aws-cli/aws-cli:2.22.35
              securityContext: *sc
              env:
                - { name: AWS_REGION, value: us-east-1 }
                - { name: HOME, value: /scratch }
                - { name: BUCKET, value: beyric-vault-snapshots-767397877316 }
              command: ["sh", "-ec"]
              args:
                - |
                  KEY="raft/vault-$(date -u +%Y-%m-%dT%H%M%SZ).snap"
                  aws s3 cp /scratch/vault.snap "s3://$BUCKET/$KEY" --only-show-errors
                  aws s3 ls "s3://$BUCKET/$KEY"
                  echo "uploaded s3://$BUCKET/$KEY"
              resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
              volumeMounts: [{ name: scratch, mountPath: /scratch }]
